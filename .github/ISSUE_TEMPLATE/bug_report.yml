name: Bug report
description: Something isn't running locally as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: save-gcp-local run --dag my_pipeline --task transform --dry-run
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include lines starting with [save-gcp-local]. Dry-run output is ideal.
      render: shell
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "save-gcp-local 0.1.0, airflow 2.7.3, providers-google 10.9.0, Python 3.10"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Container engine
      options: [docker, podman, local (host spark-submit)]
    validations:
      required: true
