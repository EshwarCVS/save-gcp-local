[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "save-gcp-local"
version = "0.1.0"
description = "Run Airflow DAGs locally and execute Dataproc/Spark jobs in local Docker instead of creating GCP clusters. Generic, zero DAG edits, pluggable test-data providers."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "save-gcp-local contributors" }]
keywords = ["airflow", "dataproc", "spark", "local", "docker", "testing", "gcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]

# Core stays dependency-light. Everything heavy is an optional extra.
dependencies = []

[project.optional-dependencies]
# Data sampling / synthetic generation
data = ["pandas>=1.3", "numpy>=1.20"]
# Database sources for the data providers
db = ["sqlalchemy>=1.4"]
# Airflow integration (users usually already have their own pinned airflow)
airflow = ["apache-airflow>=2.3", "apache-airflow-providers-google>=8.0"]
# Everything
all = ["pandas>=1.3", "numpy>=1.20", "sqlalchemy>=1.4"]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
save-gcp-local = "save_gcp_local.cli:main"

[project.urls]
Homepage = "https://github.com/EshwarCVS/save-gcp-local"
Repository = "https://github.com/EshwarCVS/save-gcp-local"
Issues = "https://github.com/EshwarCVS/save-gcp-local/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
save_gcp_local = ["py.typed"]
